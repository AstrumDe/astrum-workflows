# Reusable deploy workflow for the Astrum backend (API + Celery). The backend
# repo calls it via a thin caller. Lives in the organization's workflows repo
# so project contributors cannot change what runs on the hosts.
name: Astrum backend deploy

on:
  workflow_call:
    inputs:
      environment:
        description: production (main only) | dev (any branch)
        type: string
        required: true
      restart_api:
        description: Restart API containers one by one
        type: boolean
        default: true
      restart_celery:
        description: Restart Celery workers and beat
        type: boolean
        default: false
      create_migration:
        description: Autogenerate an alembic revision on the host and apply it
        type: boolean
        default: false
      migrate:
        description: Apply migrations (alembic upgrade head)
        type: boolean
        default: false
      rebuild_api:
        description: Rebuild the image and recreate containers (picks up .env)
        type: boolean
        default: false
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_IDS:
        required: false
        description: Comma-separated list of chat IDs

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, "${{ inputs.environment == 'production' && 'prod-runner' || 'test-runner' }}"]
    concurrency:
      group: astrum-backend-${{ inputs.environment }}-deploy
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      # Before checkout: code from a rejected run never lands on the host.
      - name: Check target
        env:
          TARGET_ENV: ${{ inputs.environment }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          # Organization variable: GitHub logins allowed to deploy production,
          # separated by spaces or commas. Empty or unset → nobody.
          PROD_DEPLOYERS: ${{ vars.ASTRUM_PROD_DEPLOYERS }}
        run: |
          # Callers are editable by project contributors, so the trigger is
          # enforced here: manual runs only.
          [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || {
            echo "::error::deploys are manual only (got $GITHUB_EVENT_NAME)"; exit 1; }
          case "$TARGET_ENV" in
            production)
              [ "$GITHUB_REF" = refs/heads/main ] || {
                echo "::error::production deploys only from main (got $GITHUB_REF)"; exit 1; }
              # Logins are case-insensitive.
              allowed=" $(printf '%s' "$PROD_DEPLOYERS" | tr 'A-Z,\n' 'a-z  ') "
              actor="$(printf '%s' "$TRIGGERING_ACTOR" | tr 'A-Z' 'a-z')"
              case "$allowed" in
                *" ${actor:?no triggering actor} "*) ;;
                *) echo "::error::$TRIGGERING_ACTOR is not allowed to deploy production"; exit 1 ;;
              esac ;;
            dev) ;;
            *) echo "::error::unknown environment: $TARGET_ENV"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Deploy
        id: deploy
        env:
          TARGET_ENV: ${{ inputs.environment }}
          RESTART_API: ${{ inputs.restart_api }}
          RESTART_CELERY: ${{ inputs.restart_celery }}
          CREATE_MIGRATION: ${{ inputs.create_migration }}
          MIGRATE: ${{ inputs.migrate }}
          REBUILD_API: ${{ inputs.rebuild_api }}
        run: |
          set -euo pipefail

          case "$TARGET_ENV" in production) P=prod ;; dev) P=dev ;; *) exit 1 ;; esac
          ROOT="/opt/github-runner/$P"
          COMPOSE="/opt/github-runner/$P-config/docker-compose.yaml"
          HEALTH_URL="http://127.0.0.1:8000/api/users/health"
          HEALTH_TIMEOUT=90
          [ -d "$ROOT" ] && [ -f "$COMPOSE" ] || { echo "::error::$ROOT or $COMPOSE is missing"; exit 1; }

          dc() { docker compose -f "$COMPOSE" "$@"; }
          services() { dc config --services | grep -E "^$P-$1\$" | sort -V; }
          alembic() { (cd "$ROOT" && .venv/bin/python -m alembic "$@"); }
          revision() { alembic current 2>/dev/null | awk 'NR==1 {print $1}'; }
          # Results for the Notify step; a later value overrides an earlier one.
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          ip_of() { docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}' "$1"; }

          wait_healthy() {
            local waited=0
            until docker exec "$1" curl -fsS -m 3 "$HEALTH_URL" 2>/dev/null | grep -q '"status":"ok"'; do
              if [ "$waited" -ge "$HEALTH_TIMEOUT" ]; then
                echo "::error::$1 is not healthy after ${HEALTH_TIMEOUT}s"
                docker logs --tail 50 "$1" || true
                return 1
              fi
              sleep 3; waited=$((waited + 3))
            done
            echo "✓ $1 is healthy (${waited}s)"
          }

          # Stop, then start or recreate one service and wait until its container is up.
          cycle() {
            if [ "$REBUILD_API" = true ]; then
              dc up -d --no-deps --force-recreate -t "$2" "$1"
            else
              dc stop -t "$2" "$1"
              dc start "$1"
            fi
          }

          echo "::group::Code"
          deps_changed=false
          cmp -s requirements.txt "$ROOT/requirements.txt" || deps_changed=true
          # No --delete and no -t/-p: the tree holds server-only data (uploads,
          # generated migrations) and files the runner does not own.
          rsync -rlc --omit-dir-times --itemize-changes \
            --exclude=.git --exclude=.github --exclude=.env --exclude=.venv --exclude=venv \
            --exclude=__pycache__ --exclude='*.pyc' --exclude='*.log' --exclude='*.log.zip' \
            --exclude=/receipts --exclude=/public --exclude=/celerybeat-schedule \
            ./ "$ROOT/"
          echo "::endgroup::"

          if [ "$deps_changed" = true ]; then
            echo "::group::Dependencies"
            "$ROOT/.venv/bin/pip" install --no-cache-dir -r "$ROOT/requirements.txt"
            echo "::endgroup::"
          fi

          if [ "$REBUILD_API" = true ]; then
            echo "::group::Build"
            # One image for API, Celery, SSE and Flower.
            dc build -q "$P-api-1"
            echo "::endgroup::"
          fi

          if [ "$MIGRATE" = true ] || [ "$CREATE_MIGRATION" = true ]; then
            echo "::group::Migrations"
            out migration "ошибка"
            rev_before="$(revision)"
            created=""
            alembic upgrade head
            if [ "$CREATE_MIGRATION" = true ]; then
              if alembic check; then
                echo "No model changes — nothing to generate"
              else
                alembic revision --autogenerate -m "auto_$(date +%Y%m%d_%H%M%S)"
                alembic upgrade head
                created=", создана $(revision)"
                echo "::warning::A migration was generated on the host in $ROOT/app/migrations/versions — commit it to the repo"
              fi
            fi
            rev_after="$(revision)"
            if [ "$rev_after" = "$rev_before" ]; then
              out migration "нет обновлений базы (${rev_after:-пусто})"
            else
              out migration "${rev_before:-пусто} → $rev_after$created"
            fi
            echo "Revision: $rev_after"
            echo "::endgroup::"
          fi

          if [ "$RESTART_API" = true ] || [ "$REBUILD_API" = true ]; then
            echo "::group::API"
            for s in $(services 'api-[0-9]+'); do
              echo "→ $s"
              old_ip="$(ip_of "$s" 2>/dev/null || true)"
              cycle "$s" 30
              wait_healthy "$s"
              # nginx resolves upstreams once, at (re)load.
              if [ "$(ip_of "$s")" != "$old_ip" ]; then
                docker exec "$P-nginx" nginx -t
                docker exec "$P-nginx" nginx -s reload
                echo "nginx reloaded: $s moved from ${old_ip:-?} to $(ip_of "$s")"
              fi
            done
            out api done
            echo "::endgroup::"
          fi

          if [ "$RESTART_CELERY" = true ]; then
            echo "::group::Celery"
            for s in $(services 'celery-worker-[0-9]+') "$P-celery-beat"; do
              echo "→ $s"
              cycle "$s" 60
              sleep 5
              [ "$(docker inspect -f '{{.State.Status}}' "$s")" = running ] || {
                echo "::error::$s is not running"; docker logs --tail 50 "$s" || true; exit 1; }
              echo "✓ $s is running"
            done
            out celery done
            echo "::endgroup::"
          fi

      - name: Notify
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          STATUS: ${{ job.status }}
          TARGET_ENV: ${{ inputs.environment }}
          API: ${{ (inputs.restart_api || inputs.rebuild_api) && (steps.deploy.outputs.api == 'done' && 'перезапущен' || 'не завершён') || 'не перезапускался' }}
          CELERY: ${{ inputs.restart_celery && (steps.deploy.outputs.celery == 'done' && 'перезапущен' || 'не завершён') || 'не перезапускался' }}
          MIGRATION: ${{ steps.deploy.outputs.migration || ((inputs.migrate || inputs.create_migration) && 'не дошло до запуска' || 'не запускалась') }}
          REBUILD: ${{ inputs.rebuild_api && 'да' || 'нет' }}
        run: |
          [ -n "$BOT_TOKEN" ] && [ -n "$CHAT_IDS" ] || { echo "Telegram is not configured"; exit 0; }
          [ "$STATUS" = success ] && icon="✅" || icon="❌"
          text="$icon Backend ($TARGET_ENV): $STATUS
          Ветка: $GITHUB_REF_NAME
          Коммит: ${GITHUB_SHA:0:7}
          Запустил: $GITHUB_TRIGGERING_ACTOR
          API: $API
          Celery: $CELERY
          Миграция: $MIGRATION
          Пересборка: $REBUILD
          $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          for chat in ${CHAT_IDS//,/ }; do
            curl -fsS -m 10 -o /dev/null "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
              --data-urlencode "chat_id=$chat" --data-urlencode "text=$text" \
              --data-urlencode "disable_web_page_preview=true" || true
          done
